name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify touch device connection lifecycle
        run: bash scripts/test_connection_state.sh

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project TouchPane.xcodeproj \
            -scheme TouchPane \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
